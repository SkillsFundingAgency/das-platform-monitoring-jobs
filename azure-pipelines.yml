trigger:
  batch: true
  branches:
    include:
      - "master"

variables:
- name: BuildPlatform
  value: any cpu
- group: RELEASE Management Resources
- group: RELEASE das-platform-monitoring-jobs
- name: Deploy
  value: $[or(eq(variables['Build.SourceBranch'], 'refs/heads/master'), eq(variables['Build.Reason'], 'Manual'), eq(variables['Build.Reason'], 'PullRequest'))]

resources:
  repositories:
  - repository: self
  - repository: das-platform-building-blocks
    type: github
    name: SkillsFundingAgency/das-platform-building-blocks
    ref: refs/tags/3.0.27
    endpoint: SkillsFundingAgency
  - repository: das-platform-automation
    type: github
    name: SkillsFundingAgency/das-platform-automation
    ref: refs/tags/5.1.21
    endpoint: SkillsFundingAgency

stages:
- stage: Build
  jobs:
  - template: pipeline-templates/job/code-build.yml

- stage: Deploy_DEV
  dependsOn: Build
  displayName: Deploy to DEV
  condition: and(succeeded(), eq(variables.Deploy, 'true'))
  variables:
  - group: Dev Management Resources
  - group: AT DevTest Shared Resources
  - group: DEV das-platform-monitoring-jobs
  jobs:
  - template: pipeline-templates/job/deploy.yml
    parameters:
      Environment: DEV
      ServiceConnection: SFA-DAS-DevTest-ARM

- stage: Deploy_PREPROD
  dependsOn: Deploy_DEV
  displayName: Deploy to PREPROD
  variables:
  - group: PreProd Management Resources
  - group: PreProd Shared Resources
  - group: PREPROD das-platform-monitoring-jobs
  jobs:
  - template: pipeline-templates/job/deploy.yml
    parameters:
      Environment: PREPROD
      ServiceConnection: SFA-DIG-PreProd-ARM

- stage: Deploy_PROD
  dependsOn: Deploy_PREPROD
  displayName: Deploy to PROD
  variables:
  - group: Prod Management Resources
  - group: Prod Shared Resources
  - group: PROD das-platform-monitoring-jobs
  jobs:
  - template: pipeline-templates/job/deploy.yml
    parameters:
      Environment: PROD
      ServiceConnection: SFA-DIG-Prod-ARM
